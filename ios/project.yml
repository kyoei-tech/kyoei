# XcodeGen spec for the KYOEI iOS app. Generate the Xcode project with:
#   brew install xcodegen && cd ios && xcodegen
# Kyoei.xcodeproj is generated output and git-ignored.
name: Kyoei
options:
  bundleIdPrefix: jp.kyoei
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
configFiles:
  # Includes the git-ignored Secrets.xcconfig and optional Local.xcconfig.
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  KyoeiCore:
    path: KyoeiCore
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0
targets:
  Kyoei:
    type: application
    platform: iOS
    sources:
      - path: Kyoei
    dependencies:
      - package: KyoeiCore
      - package: Supabase
        product: Supabase
    # Signing entitlements: Kyoei/Kyoei.entitlements (aps-environment for
    # Push Notifications; Xcode re-signs it as "production" when exporting
    # for TestFlight/App Store), chosen via CODE_SIGN_ENTITLEMENTS below.
    info:
      path: Kyoei/Info.plist
      properties:
        CFBundleDisplayName: KYOEI
        CFBundleDevelopmentRegion: ja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Supabase email confirmation links return to the app (AuthStore.redirectURL).
        CFBundleURLTypes:
          - CFBundleURLName: jp.kyoei.app.auth
            CFBundleURLSchemes:
              - kyoei
        NSFaceIDUsageDescription: しばらく離れたあとにアプリを開くとき、本人確認に使用します。
        NSCameraUsageDescription: 配車表の車台番号の照合と、事故報告での免許証などの撮影に使用します。
        NSPhotoLibraryAddUsageDescription: 事故報告の画像を写真に保存するために使用します。
        # Injected from Config/Secrets.xcconfig; read by App/AppConfig.swift.
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    settings:
      base:
        # From Config/Base.xcconfig (jp.kyoei.app + push), overridable per
        # machine in Config/Local.xcconfig for free-team device builds.
        PRODUCT_BUNDLE_IDENTIFIER: $(KYOEI_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: $(KYOEI_ENTITLEMENTS)
        # Resources/Assets.xcassets/AppIcon: the lime logo on charcoal.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Kyoei:
    build:
      targets:
        Kyoei: all
    run:
      config: Debug
    archive:
      config: Release
